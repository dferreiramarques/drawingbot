name: Publicar DrawingBot no GitHub Pages

on:
  push:
    branches: [main]
    paths-ignore:
      - 'firmware/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build:pi
      - name: Pacote do Raspberry Pi
        run: |
          mkdir -p dist/pi
          cp dist-pi/drawingbot-pi.tar.gz dist/pi/
          cp dist-pi/drawingbot/install.sh dist/pi/install.sh
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
